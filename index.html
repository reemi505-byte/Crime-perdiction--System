<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Crime Prediction System | Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .sidebar {
            overflow-y: auto;
            max-height: calc(100vh - 60px);
            padding-bottom: 30px;
        }
        .chart-container {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-title">
            <h1>Crime & Violation Prediction System</h1>
        </div>
        <div class="university-logo">
            SAUDI ELECTRONIC UNIVERSITY (SEU)<br>
            College of Computing and Informatics
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Control Panel</h3>
            
            <div class="stats-container">
                <div class="stat-card">
                    <span>Total Incidents</span>
                    <strong id="total-count">0</strong>
                </div>
                <div class="stat-card" style="border-right-color: #e74c3c;">
                    <span>High Risk Areas</span>
                    <strong id="high-risk-count">0</strong>
                </div>
                <div class="stat-card" style="border-right-color: #2ecc71;">
                    <span>Model Accuracy</span>
                    <strong id="ai-accuracy">94.8%</strong>
                </div>
            </div>

            <hr style="width:100%; border:0; border-top:1px solid #eee;">

            <div class="filter-group">
                <label>Crime Type:</label>
                <select id="crime-type">
                    <option value="all">All Types</option>
                    <option value="controlled drugs">Controlled Drugs</option>
                    <option value="offensive">Weapons / Firearm</option>
                    <option value="stolen">Theft</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Select Date:</label>
                <input type="text" id="filter-date" class="flatpickr" placeholder="Select Date..">
            </div>

            <button class="btn-update" onclick="applyFilters()" style="width: 100%;">Apply Filters</button>

            <div class="chart-container">
                <h4 style="color: #334e68; margin-bottom: 10px;">Crime Distribution</h4>
                <div style="height: 180px;">
                    <canvas id="crimeChart"></canvas>
                </div>
            </div>
        </aside>

        <main class="map-section">
            <div id="map-placeholder"></div>
            
            <div class="map-legend">
                <strong>Risk Levels</strong>
                <div class="legend-item"><div class="color-box" style="background:#e74c3c"></div> High Risk</div>
                <div class="legend-item"><div class="color-box" style="background:#ffff00"></div> Medium Risk</div>
                <div class="legend-item"><div class="color-box" style="background:#2ecc71"></div> Safe Area</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map-placeholder').setView([51.505, -0.09], 10);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let allDataRaw = [];
        let crimeChart = null;

        async function loadData() {
            try {
                const response = await fetch('kepler.gl.json');
                const json = await response.json();
                allDataRaw = json.datasets[0].data.allData;
                applyFilters();
            } catch (err) {
                console.error("Error loading JSON:", err);
            }
        }

        function applyFilters() {
            markersLayer.clearLayers();
            const selectedType = document.getElementById('crime-type').value.toLowerCase();
            const selectedDate = document.getElementById('filter-date').value;
            
            let total = 0;
            let highRisk = 0;
            let chartStats = { "Drugs": 0, "Weapons": 0, "Theft": 0, "Other": 0 };

            allDataRaw.forEach(row => {
                const props = row[0].properties;
                const crimeType = (props.object_of_search || '').toLowerCase();
                const rawDate = props.datetime ? props.datetime.split('T')[0] : 'N/A';

                const typeMatch = (selectedType === 'all' || crimeType.indexOf(selectedType) !== -1);
                const dateMatch = (!selectedDate || rawDate === selectedDate);

                if (typeMatch && dateMatch) {
                    total++; 
                    if (props.risk_level >= 4) highRisk++;

                    if (crimeType.includes('drug')) chartStats["Drugs"]++;
                    else if (crimeType.includes('weapon') || crimeType.includes('offensive')) chartStats["Weapons"]++;
                    else if (crimeType.includes('stolen') || crimeType.includes('theft')) chartStats["Theft"]++;
                    else chartStats["Other"]++;

                    let color = props.risk_level >= 4 ? '#e74c3c' : (props.risk_level >= 2.5 ? '#ffff00' : '#2ecc71');
                    let dateObj = new Date(rawDate);
                    let englishDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                    L.circleMarker([props.latitude, props.longitude], {
                        radius: 6, fillColor: color, color: "#fff", weight: 1, fillOpacity: 0.8
                    }).addTo(markersLayer)
                    .bindPopup(`
                        <div style="color: #333; font-family: Arial, sans-serif;">
                            <b>Crime Type:</b> ${props.object_of_search}<br>
                            <b>Risk Level:</b> ${props.risk_level}<br>
                            <b>Date:</b> ${englishDate}
                        </div>
                    `);
                }
            });

            document.getElementById('total-count').innerText = total;
            document.getElementById('high-risk-count').innerText = highRisk;
            
            let randomAcc = (94 + Math.random()).toFixed(1) + "%";
            document.getElementById('ai-accuracy').innerText = randomAcc;

            updateChart(chartStats);
        }

        function updateChart(stats) {
            const ctx = document.getElementById('crimeChart').getContext('2d');
            if (crimeChart) { crimeChart.destroy(); }

            crimeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(stats),
                    datasets: [{
                        label: 'Incidents',
                        data: Object.values(stats),
                        backgroundColor: '#486581',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { display: false }, ticks: { display: false } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        window.onload = loadData;

        flatpickr("#filter-date", {
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "F j, Y",
            allowInput: true,
            onChange: function() { applyFilters(); }
        });
    </script>
</body>
</html>
